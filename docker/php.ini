memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 272M
max_execution_time = 300
max_input_vars = 5000
expose_php = Off
display_errors = Off
log_errors = On
; Preserve Drupal/Mime Mail formatting, delivering through Resend's HTTPS API.
sendmail_path = "/usr/local/bin/opigno-resend-mail -t -i"
date.timezone = UTC
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
